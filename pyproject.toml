[project]
name = "receipts-backend"
version = "1.0.0"
description = "Receipts API - FastAPI backend for OCR-based expense tracking"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "google-genai>=1.0.0",
    "Pillow==10.3.0",
]

[tool.uv]
package = false
