[project]
name = "receipts-backend"
version = "2.0.0"
description = "Receipt scanning, expense tracking, and analytics API"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ────────────────────────────────────────────
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "python-multipart==0.0.9",
    # ── Database ─────────────────────────────────────────────────
    "sqlalchemy>=2.0",
    "psycopg[binary]==3.3.6",
    # ── Auth ─────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.0.0",
    "email-validator>=2.0",
    # ── Settings ─────────────────────────────────────────────────
    "pydantic-settings==2.3.3",
    # ── OCR / AI ─────────────────────────────────────────────────
    "google-genai>=1.0.0",
    "pillow==10.3.0",
    "tenacity>=8.0",
    "pydantic==2.7.4",
    "python-dotenv==1.0.1",
    "psycopg-binary==3.3.6",
    "rapidocr-onnxruntime>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
